name: Test, release and publish image

# Every push to the default branch that passes the tests becomes a new GitHub Release
# (v1.0.0, v1.0.1, ...) and a new multi-arch image on ghcr.io with matching tags.
# Other branches and pull requests are test + build only (nothing is published).
#
# Version bump: patch by default. Put [minor] or [major] in the first line of the commit
# message, or run this workflow manually and choose the bump.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump for the new release
        type: choice
        options: [patch, minor, major]
        default: patch

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a release in progress on the default branch (queued runs keep versions in order).
  cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

permissions:
  contents: read

jobs:
  # Plain-Node tests of the server: storage guarantees (atomic writes, snapshots, recovery), data sources and the HTTP API.
  server:
    name: Server tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm test

  # Type-check, unit + component tests with a coverage gate, and a production build of the web app.
  web:
    name: Web (types, unit, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: web/dist
          retention-days: 3

  # Real browser against the real server (talking to a fake Steam / psthc.fr, never the internet): add a game, achievements, ratings, persistence, accessibility, phone layout.
  e2e:
    name: End-to-end (browser)
    needs: web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: web/dist
      - run: npm run e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7

  # Build the real image and check the promises that matter on the NAS: data survives a restart / recreate, bad permissions are explained.
  container:
    name: Container smoke test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read   # pull the previous release for the update test
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: game-tracker:test
          build-args: APP_VERSION=ci-smoke
          cache-from: type=gha,scope=smoke
          cache-to: type=gha,scope=smoke,mode=max
      - name: The deployment file is valid
        run: |
          docker compose -f docker-compose.yml config -q
          # On the NAS the project folder holds only this file: a "build:" line would make Compose look for a Dockerfile there.
          if docker compose -f docker-compose.yml config | grep -qE '^\s+build:'; then echo 'docker-compose.yml must not contain build:'; exit 1; fi
      # The update promise: the NEW image on data written by the PREVIOUS release leaves state.json byte-for-byte identical.
      # (Skipped on the very first release, when there is no previous image yet.)
      - name: Previous release image (for the update test)
        id: prev
        continue-on-error: true
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          prev="ghcr.io/${GITHUB_REPOSITORY,,}:latest"
          if docker pull "$prev"; then echo "image=$prev" >> "$GITHUB_OUTPUT"; else echo "No previous release to test the update against."; fi
      - name: Data survives restart, recreate and UPDATE
        env:
          PREV_IMAGE: ${{ steps.prev.outputs.image }}
        run: bash scripts/container-smoke.sh game-tracker:test

  image:
    needs: [server, web, e2e, container]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the tag and release
      packages: write   # push to ghcr.io
    env:
      PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    steps:
      - uses: actions/checkout@v7

      - name: Image name (must be lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Work out the version
        id: ver
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          INPUT_BUMP: ${{ inputs.bump }}
        run: |
          if [ "$PUBLISH" != "true" ]; then
            echo "version=dev" >> "$GITHUB_OUTPUT"; echo "major=0" >> "$GITHUB_OUTPUT"; echo "minor=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --tags --force --quiet origin
          existing=$(git tag --points-at "$GITHUB_SHA" --list 'v[0-9]*.[0-9]*.[0-9]*' | head -n1)
          if [ -n "$existing" ]; then
            v="${existing#v}"   # re-run of a commit that was already released: keep its version
          else
            last=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
            title="${COMMIT_MSG%%$'\n'*}"
            bump=patch
            case "$title" in *'[major]'*) bump=major;; *'[minor]'*) bump=minor;; esac
            if [ -n "$INPUT_BUMP" ]; then bump="$INPUT_BUMP"; fi
            if [ -z "$last" ]; then
              v=1.0.0
            else
              IFS=. read -r ma mi pa <<< "${last#v}"
              case "$bump" in
                major) ma=$((ma+1)); mi=0; pa=0;;
                minor) mi=$((mi+1)); pa=0;;
                *) pa=$((pa+1));;
              esac
              v="$ma.$mi.$pa"
            fi
          fi
          IFS=. read -r ma mi pa <<< "$v"
          echo "version=$v" >> "$GITHUB_OUTPUT"; echo "major=$ma" >> "$GITHUB_OUTPUT"; echo "minor=$mi" >> "$GITHUB_OUTPUT"
          echo "Releasing v$v"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable=${{ env.PUBLISH == 'true' }}
            type=raw,value=${{ steps.ver.outputs.version }},enable=${{ env.PUBLISH == 'true' }}
            type=raw,value=${{ steps.ver.outputs.major }}.${{ steps.ver.outputs.minor }},enable=${{ env.PUBLISH == 'true' }}
            type=raw,value=${{ steps.ver.outputs.major }},enable=${{ env.PUBLISH == 'true' }}
            type=sha,format=short
            type=ref,event=pr
          labels: |
            org.opencontainers.image.title=Game Tracker
            org.opencontainers.image.description=Self-hosted video game tracker: library, trophies and achievements, ratings
            org.opencontainers.image.version=${{ steps.ver.outputs.version }}

      - name: Build (and push when publishing)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_VERSION=${{ steps.ver.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Plain manifests keep NAS container UIs happy (no extra attestation entries).
          provenance: false
          sbom: false

      # Only after the image is safely pushed, so a release never points at a missing image.
      - name: Create the GitHub release
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          tag="v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists"
            exit 0
          fi
          {
            echo '## Docker image'
            echo
            echo '```sh'
            echo "docker pull $IMAGE:$VERSION"
            echo '```'
            echo
            echo "Tags: \`$VERSION\`, \`${{ steps.ver.outputs.major }}.${{ steps.ver.outputs.minor }}\`, \`${{ steps.ver.outputs.major }}\`, \`latest\` (linux/amd64, linux/arm64)."
            echo
            echo "Your data lives in the mounted \`/data\` folder and is never touched by an update."
            echo
          } > release-header.md
          gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --notes-file release-header.md --generate-notes --latest
